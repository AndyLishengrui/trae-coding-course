<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的进度 — 剑道试炼</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .progress-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--gap-xl) var(--gap-lg);
        }

        .progress-header {
            text-align: center;
            margin-bottom: var(--gap-xl);
        }

        .progress-header h1 {
            font-family: var(--font-sans);
            color: var(--color-heading);
            font-size: 2em;
            margin-bottom: var(--gap-sm);
        }

        .progress-header p {
            color: var(--color-text-muted);
        }

        /* Stats Overview */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--gap-lg);
            margin-bottom: var(--gap-xl);
        }

        .stat-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--gap-lg);
            text-align: center;
            box-shadow: var(--shadow-card);
        }

        .stat-card-icon {
            font-size: 2em;
            margin-bottom: var(--gap-sm);
        }

        .stat-card-value {
            font-family: var(--font-sans);
            font-size: 2.5em;
            font-weight: bold;
            color: var(--color-heading);
            margin-bottom: var(--gap-xs);
        }

        .stat-card-label {
            font-family: var(--font-sans);
            font-size: 0.85em;
            color: var(--color-text-muted);
        }

        /* Sword Energy Bar */
        .energy-bar {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--gap-lg);
            margin-bottom: var(--gap-xl);
            box-shadow: var(--shadow-card);
        }

        .energy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--gap-md);
        }

        .energy-title {
            font-family: var(--font-sans);
            font-size: 1.1em;
            color: var(--color-heading);
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
        }

        .energy-value {
            font-family: var(--font-sans);
            font-size: 1.5em;
            font-weight: bold;
            color: var(--color-accent);
        }

        .energy-progress {
            height: 12px;
            background: var(--color-bg);
            border-radius: 6px;
            overflow: hidden;
        }

        .energy-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-heading), var(--color-accent));
            transition: width 0.5s ease;
            border-radius: 6px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            margin-top: var(--gap-sm);
            font-family: var(--font-sans);
            font-size: 0.8em;
            color: var(--color-text-muted);
        }

        /* Chapter Progress */
        .chapter-progress {
            margin-bottom: var(--gap-xl);
        }

        .chapter-progress h2 {
            font-family: var(--font-sans);
            color: var(--color-heading);
            font-size: 1.5em;
            margin-bottom: var(--gap-lg);
            padding-left: var(--gap-md);
            border-left: 4px solid var(--color-heading);
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--gap-lg);
        }

        .chapter-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--gap-lg);
            box-shadow: var(--shadow-card);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chapter-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .chapter-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--gap-md);
        }

        .chapter-card-title {
            font-family: var(--font-sans);
            font-size: 1.1em;
            color: var(--color-heading);
            font-weight: bold;
        }

        .chapter-card-subtitle {
            font-size: 0.85em;
            color: var(--color-text-muted);
            margin-top: var(--gap-xs);
        }

        .chapter-card-progress {
            font-family: var(--font-sans);
            font-size: 0.9em;
            color: var(--color-accent);
            font-weight: bold;
        }

        .chapter-progress-bar {
            height: 8px;
            background: var(--color-bg);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: var(--gap-md);
        }

        .chapter-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-success), var(--color-accent));
            transition: width 0.5s ease;
            border-radius: 4px;
        }

        .problem-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: var(--gap-sm);
        }

        .problem-cell {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 0.7em;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
        }

        .problem-cell:hover {
            transform: scale(1.1);
        }

        .problem-cell.solved {
            background: rgba(46,125,50,0.2);
            color: var(--color-success);
            border: 1px solid rgba(46,125,50,0.3);
        }

        .problem-cell.attempted {
            background: rgba(245,127,23,0.2);
            color: var(--color-warning);
            border: 1px solid rgba(245,127,23,0.3);
        }

        .problem-cell.unsolved {
            background: var(--color-bg);
            color: var(--color-text-muted);
            border: 1px solid var(--color-border);
        }

        /* Achievements */
        .achievements {
            margin-bottom: var(--gap-xl);
        }

        .achievements h2 {
            font-family: var(--font-sans);
            color: var(--color-heading);
            font-size: 1.5em;
            margin-bottom: var(--gap-lg);
            padding-left: var(--gap-md);
            border-left: 4px solid var(--color-heading);
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--gap-lg);
        }

        .achievement-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--gap-lg);
            text-align: center;
            box-shadow: var(--shadow-card);
            transition: transform 0.2s;
        }

        .achievement-card:hover {
            transform: translateY(-2px);
        }

        .achievement-card.locked {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .achievement-icon {
            font-size: 2.5em;
            margin-bottom: var(--gap-sm);
        }

        .achievement-name {
            font-family: var(--font-sans);
            font-size: 1em;
            font-weight: bold;
            color: var(--color-heading);
            margin-bottom: var(--gap-xs);
        }

        .achievement-desc {
            font-size: 0.8em;
            color: var(--color-text-muted);
        }

        /* Activity Heatmap */
        .activity-section {
            margin-bottom: var(--gap-xl);
        }

        .activity-section h2 {
            font-family: var(--font-sans);
            color: var(--color-heading);
            font-size: 1.5em;
            margin-bottom: var(--gap-lg);
            padding-left: var(--gap-md);
            border-left: 4px solid var(--color-heading);
        }

        .heatmap-container {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--gap-lg);
            box-shadow: var(--shadow-card);
            overflow-x: auto;
        }

        .heatmap {
            display: flex;
            gap: 3px;
        }

        .heatmap-week {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .heatmap-day {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            background: var(--color-bg);
        }

        .heatmap-day.level-1 { background: rgba(46,125,50,0.3); }
        .heatmap-day.level-2 { background: rgba(46,125,50,0.5); }
        .heatmap-day.level-3 { background: rgba(46,125,50,0.7); }
        .heatmap-day.level-4 { background: var(--color-success); }

        .heatmap-legend {
            display: flex;
            align-items: center;
            gap: var(--gap-sm);
            margin-top: var(--gap-md);
            font-family: var(--font-sans);
            font-size: 0.8em;
            color: var(--color-text-muted);
        }

        .heatmap-legend-item {
            width: 14px;
            height: 14px;
            border-radius: 2px;
        }

        /* Recent Activity */
        .recent-activity {
            margin-bottom: var(--gap-xl);
        }

        .recent-activity h2 {
            font-family: var(--font-sans);
            color: var(--color-heading);
            font-size: 1.5em;
            margin-bottom: var(--gap-lg);
            padding-left: var(--gap-md);
            border-left: 4px solid var(--color-heading);
        }

        .activity-list {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: var(--gap-md);
            padding: var(--gap-md) var(--gap-lg);
            border-bottom: 1px solid var(--color-border);
            transition: background 0.2s;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item:hover {
            background: rgba(139,0,0,0.03);
        }

        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            flex-shrink: 0;
        }

        .activity-icon.solved { background: rgba(46,125,50,0.1); }
        .activity-icon.attempted { background: rgba(245,127,23,0.1); }
        .activity-icon.hint { background: rgba(21,101,192,0.1); }

        .activity-content {
            flex: 1;
        }

        .activity-text {
            font-family: var(--font-sans);
            font-size: 0.9em;
            color: var(--color-text);
        }

        .activity-time {
            font-size: 0.8em;
            color: var(--color-text-muted);
            margin-top: var(--gap-xs);
        }

        .activity-points {
            font-family: var(--font-sans);
            font-weight: bold;
            color: var(--color-accent);
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <a href="../index.html" class="nav-brand">剑道试炼</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link-text">互动编程</a>
            <a href="progress.html" class="nav-link-text active">我的进度</a>
            <a href="leaderboard.html" class="nav-link-text">排行榜</a>
            <button class="dark-toggle" aria-label="Toggle dark mode">☾</button>
            <div class="user-menu">
                <button class="user-btn" id="userBtn">
                    <span class="user-avatar">剑</span>
                    <span class="user-name" id="userName">未登录</span>
                </button>
            </div>
        </div>
        <button class="menu-toggle" aria-label="Toggle menu">☰</button>
    </nav>

    <div class="progress-page">
        <div class="progress-header">
            <h1>我的修炼进度</h1>
            <p>追踪你的剑道修炼之路</p>
        </div>

        <!-- Stats Overview -->
        <div class="stats-overview">
            <div class="stat-card">
                <div class="stat-card-icon">⚔️</div>
                <div class="stat-card-value" id="solvedCount">0</div>
                <div class="stat-card-label">已完成题目</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon">📝</div>
                <div class="stat-card-value" id="attemptedCount">0</div>
                <div class="stat-card-label">已尝试题目</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon">🔥</div>
                <div class="stat-card-value" id="streakDays">0</div>
                <div class="stat-card-label">连续天数</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon">⭐</div>
                <div class="stat-card-value" id="totalPoints">0</div>
                <div class="stat-card-label">总积分</div>
            </div>
        </div>

        <!-- Sword Energy -->
        <div class="energy-bar">
            <div class="energy-header">
                <div class="energy-title">⚡ 剑气值</div>
                <div class="energy-value" id="energyValue">100</div>
            </div>
            <div class="energy-progress">
                <div class="energy-progress-fill" id="energyFill" style="width: 100%;"></div>
            </div>
            <div class="energy-info">
                <span>用于查看提示和解锁功能</span>
                <span>最大值: 100</span>
            </div>
        </div>

        <!-- Chapter Progress -->
        <div class="chapter-progress">
            <h2>章节进度</h2>
            <div class="chapter-grid" id="chapterGrid">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Achievements -->
        <div class="achievements">
            <h2>成就徽章</h2>
            <div class="achievement-grid" id="achievementGrid">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Activity Heatmap -->
        <div class="activity-section">
            <h2>活跃度</h2>
            <div class="heatmap-container">
                <div class="heatmap" id="heatmap">
                    <!-- Dynamically populated -->
                </div>
                <div class="heatmap-legend">
                    <span>少</span>
                    <div class="heatmap-legend-item" style="background: var(--color-bg);"></div>
                    <div class="heatmap-legend-item" style="background: rgba(46,125,50,0.3);"></div>
                    <div class="heatmap-legend-item" style="background: rgba(46,125,50,0.5);"></div>
                    <div class="heatmap-legend-item" style="background: rgba(46,125,50,0.7);"></div>
                    <div class="heatmap-legend-item" style="background: var(--color-success);"></div>
                    <span>多</span>
                </div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="recent-activity">
            <h2>最近动态</h2>
            <div class="activity-list" id="activityList">
                <!-- Dynamically populated -->
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // Progress Page Logic
        // ============================================================

        const CHAPTERS = [
            { id: 1, name: '持剑叩门', subtitle: '变量与输入输出', count: 14 },
            { id: 2, name: '歧路逢生', subtitle: '条件判断与分支', count: 14 },
            { id: 3, name: '千回百转', subtitle: 'for与while', count: 14 },
            { id: 4, name: '排兵布阵', subtitle: '数组', count: 12 },
            { id: 5, name: '十二宫剑阵', subtitle: '二维数组', count: 12 },
            { id: 6, name: '古卷密文', subtitle: '字符串处理', count: 14 },
            { id: 7, name: '以招创招', subtitle: '函数与递归', count: 15 },
            { id: 8, name: '百器图谱', subtitle: '容器与内置算法', count: 7 },
            { id: 9, name: '快剑如风', subtitle: '排序与二分', count: 6 },
            { id: 10, name: '千锤百炼', subtitle: '高精度与位运算', count: 8 },
            { id: 11, name: '蓄势待发', subtitle: '前缀和、差分与双指针', count: 9 },
            { id: 12, name: '利器出鞘', subtitle: '进阶数据结构', count: 11 },
            { id: 13, name: '迷雾寻踪', subtitle: '搜索与回溯', count: 6 },
            { id: 14, name: '千里奔袭', subtitle: '最短路与生成树', count: 8 },
            { id: 15, name: '华山论剑', subtitle: '动态规划', count: 18 }
        ];

        const ACHIEVEMENTS = [
            { id: 'first_blood', icon: '🗡️', name: '初次拔剑', desc: '完成第一道题', condition: (p) => p.solved >= 1 },
            { id: 'ten_problems', icon: '⚔️', name: '小有成就', desc: '完成10道题', condition: (p) => p.solved >= 10 },
            { id: 'chapter1_clear', icon: '🏆', name: '叩门成功', desc: '完成第一章全部题目', condition: (p) => p.chapter1 >= 14 },
            { id: 'fifty_problems', icon: '🔥', name: '剑道入门', desc: '完成50道题', condition: (p) => p.solved >= 50 },
            { id: 'hundred_problems', icon: '💎', name: '百炼成钢', desc: '完成100道题', condition: (p) => p.solved >= 100 },
            { id: 'all_clear', icon: '👑', name: '华山论剑', desc: '完成全部172道题', condition: (p) => p.solved >= 172 },
            { id: 'streak7', icon: '🔥', name: '七日连战', desc: '连续7天刷题', condition: (p) => p.streak >= 7 },
            { id: 'no_hints', icon: '🧠', name: '独立思考', desc: '连续10题不使用提示', condition: (p) => p.noHints >= 10 },
            { id: 'speed_demon', icon: '⚡', name: '快剑如风', desc: '5分钟内完成一道题', condition: (p) => p.fastSolve },
            { id: 'both_langs', icon: '🔄', name: '双剑合璧', desc: '用C++和Python各完成一道题', condition: (p) => p.bothLangs }
        ];

        let progressData = {
            solved: 0,
            attempted: 0,
            streak: 0,
            totalPoints: 0,
            energy: 100,
            chapterProgress: {},
            achievements: [],
            activity: []
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProgressData();
            renderProgress();
        });

        function loadProgressData() {
            // Load from localStorage
            const progress = JSON.parse(localStorage.getItem('jd_progress') || '{}');
            const submissions = JSON.parse(localStorage.getItem('jd_submissions') || '[]');
            const energy = parseInt(localStorage.getItem('jd_sword_energy') || '100');

            // Calculate stats
            const solved = Object.values(progress).filter(s => s === 'solved').length;
            const attempted = Object.values(progress).filter(s => s === 'attempted').length;

            // Calculate chapter progress
            const chapterProgress = {};
            CHAPTERS.forEach(ch => {
                chapterProgress[ch.id] = { solved: 0, attempted: 0, total: ch.count };
            });

            Object.entries(progress).forEach(([problemId, status]) => {
                const ch = parseInt(problemId.replace('JD', '').substring(0, 2));
                if (chapterProgress[ch]) {
                    if (status === 'solved') chapterProgress[ch].solved++;
                    else if (status === 'attempted') chapterProgress[ch].attempted++;
                }
            });

            // Calculate streak
            const today = new Date().toDateString();
            const activityDays = new Set();
            submissions.forEach(s => {
                activityDays.add(new Date(s.timestamp).toDateString());
            });

            let streak = 0;
            let checkDate = new Date();
            while (activityDays.has(checkDate.toDateString())) {
                streak++;
                checkDate.setDate(checkDate.getDate() - 1);
            }

            progressData = {
                solved,
                attempted,
                streak,
                totalPoints: solved * 10,
                energy,
                chapterProgress,
                achievements: [],
                activity: submissions.slice(0, 10)
            };

            // Check achievements
            checkAchievements();
        }

        function checkAchievements() {
            const earned = JSON.parse(localStorage.getItem('jd_achievements') || '[]');
            const stats = {
                solved: progressData.solved,
                chapter1: progressData.chapterProgress[1]?.solved || 0,
                streak: progressData.streak,
                noHints: 0, // Would need to track this
                fastSolve: false, // Would need to track this
                bothLangs: false // Would need to track this
            };

            ACHIEVEMENTS.forEach(ach => {
                if (!earned.includes(ach.id) && ach.condition(stats)) {
                    earned.push(ach.id);
                }
            });

            localStorage.setItem('jd_achievements', JSON.stringify(earned));
            progressData.achievements = earned;
        }

        function renderProgress() {
            // Update stats
            document.getElementById('solvedCount').textContent = progressData.solved;
            document.getElementById('attemptedCount').textContent = progressData.attempted;
            document.getElementById('streakDays').textContent = progressData.streak;
            document.getElementById('totalPoints').textContent = progressData.totalPoints;
            document.getElementById('energyValue').textContent = progressData.energy;
            document.getElementById('energyFill').style.width = `${progressData.energy}%`;

            renderChapterGrid();
            renderAchievements();
            renderHeatmap();
            renderActivityList();
        }

        function renderChapterGrid() {
            const grid = document.getElementById('chapterGrid');

            grid.innerHTML = CHAPTERS.map(ch => {
                const progress = progressData.chapterProgress[ch.id] || { solved: 0, attempted: 0, total: ch.count };
                const percentage = Math.round((progress.solved / progress.total) * 100);

                const problems = Array.from({ length: ch.count }, (_, i) => {
                    const jdId = `JD${String(ch.id).padStart(2, '0')}${String(i + 1).padStart(2, '0')}`;
                    const status = getProblemStatus(jdId);
                    return `<div class="problem-cell ${status}" title="${jdId}">${i + 1}</div>`;
                }).join('');

                return `
                    <div class="chapter-card">
                        <div class="chapter-card-header">
                            <div>
                                <div class="chapter-card-title">第${ch.id}章 ${ch.name}</div>
                                <div class="chapter-card-subtitle">${ch.subtitle}</div>
                            </div>
                            <div class="chapter-card-progress">${progress.solved}/${progress.total}</div>
                        </div>
                        <div class="chapter-progress-bar">
                            <div class="chapter-progress-fill" style="width: ${percentage}%;"></div>
                        </div>
                        <div class="problem-grid">${problems}</div>
                    </div>
                `;
            }).join('');
        }

        function renderAchievements() {
            const grid = document.getElementById('achievementGrid');

            grid.innerHTML = ACHIEVEMENTS.map(ach => {
                const earned = progressData.achievements.includes(ach.id);
                return `
                    <div class="achievement-card ${earned ? '' : 'locked'}">
                        <div class="achievement-icon">${ach.icon}</div>
                        <div class="achievement-name">${ach.name}</div>
                        <div class="achievement-desc">${ach.desc}</div>
                    </div>
                `;
            }).join('');
        }

        function renderHeatmap() {
            const heatmap = document.getElementById('heatmap');
            const today = new Date();
            const weeks = 20;

            // Generate demo activity data
            const activityData = {};
            for (let i = 0; i < weeks * 7; i++) {
                const date = new Date(today);
                date.setDate(date.getDate() - i);
                const key = date.toISOString().split('T')[0];
                activityData[key] = Math.random() > 0.3 ? Math.floor(Math.random() * 5) : 0;
            }

            let html = '';
            for (let w = 0; w < weeks; w++) {
                html += '<div class="heatmap-week">';
                for (let d = 0; d < 7; d++) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - (w * 7 + d));
                    const key = date.toISOString().split('T')[0];
                    const level = activityData[key] || 0;
                    const levelClass = level > 0 ? `level-${Math.min(level, 4)}` : '';
                    html += `<div class="heatmap-day ${levelClass}" title="${key}: ${level} 题"></div>`;
                }
                html += '</div>';
            }

            heatmap.innerHTML = html;
        }

        function renderActivityList() {
            const list = document.getElementById('activityList');
            const activities = progressData.activity;

            if (activities.length === 0) {
                list.innerHTML = `
                    <div style="padding: var(--gap-xl); text-align: center; color: var(--color-text-muted);">
                        暂无活动记录，开始你的第一道题吧！
                    </div>
                `;
                return;
            }

            list.innerHTML = activities.map(a => {
                const icon = a.passed ? 'solved' : 'attempted';
                const iconEmoji = a.passed ? '✅' : '❌';
                const text = a.passed
                    ? `通过了 ${a.problemId}`
                    : `尝试了 ${a.problemId}`;
                const time = getTimeAgo(a.timestamp);
                const points = a.passed ? '+10' : '';

                return `
                    <div class="activity-item">
                        <div class="activity-icon ${icon}">${iconEmoji}</div>
                        <div class="activity-content">
                            <div class="activity-text">${text}</div>
                            <div class="activity-time">${time}</div>
                        </div>
                        <div class="activity-points">${points}</div>
                    </div>
                `;
            }).join('');
        }

        function getProblemStatus(problemId) {
            const progress = JSON.parse(localStorage.getItem('jd_progress') || '{}');
            return progress[problemId] || 'unsolved';
        }

        function getTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
            return `${Math.floor(diff / 86400000)}天前`;
        }

        // Dark mode
        const darkToggle = document.querySelector('.dark-toggle');
        if (darkToggle) {
            darkToggle.addEventListener('click', () => {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    darkToggle.textContent = '☾';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    darkToggle.textContent = '☀';
                }
            });
        }

        // Mobile menu
        const menuToggle = document.querySelector('.menu-toggle');
        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                document.querySelector('.nav-links').classList.toggle('open');
            });
        }
    </script>
</body>
</html>
